version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hajj_postgres
    environment:
      POSTGRES_DB: hajj_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hajj_network

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hajj_api
    environment:
      PORT: 8090
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hajj_db
      JWT_SECRET: dev-secret-key-change-in-production
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./artifacts/api-server:/app/artifacts/api-server
      - ./lib:/app/lib
    networks:
      - hajj_network
    command: pnpm --filter @workspace/api-server run dev

volumes:
  postgres_data:

networks:
  hajj_network:
    driver: bridge
