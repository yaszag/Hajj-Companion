kind = "web"
previewPath = "/"
title = "Hajj Companion"
version = "1.0.0"
id = "artifacts/hajj-companion"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25658

[services.development]
run = "pnpm --filter @workspace/hajj-companion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hajj-companion", "run", "build" ]
publicDir = "artifacts/hajj-companion/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25658"
BASE_PATH = "/"
